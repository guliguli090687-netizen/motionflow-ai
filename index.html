<!DOCTYPE html>
<html>
<head>
<title>MotionFlow AI</title>
<style>
body{
margin:0;
font-family:Arial;
background:#000;
color:white;
text-align:center;
}

.hero{
padding:100px 20px;
}

button{
padding:15px 30px;
background:#00ccff;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
position:relative;
z-index:10;
}

input{
padding:12px;
width:300px;
margin:20px;
border-radius:8px;
border:none;
}

#preview{
display:none;
max-width:400px;
margin:30px auto;
border-radius:15px;
transition:1s ease;
position:relative;
z-index:1;
}

#status{
margin-top:20px;
font-size:20px;
color:#00ccff;
font-weight:bold;
}
</style>
</head>
<body>

<div class="hero">
<h1>MotionFlow AI</h1>
<p>Upload fashion image and preview render</p>

<input type="file" id="upload" accept="image/*"><br><br>

<button onclick="previewImage()">Preview</button>
<button onclick="generateMotion()">Generate AI Motion</button>

<p id="status"></p>

<br>
<img id="preview">

</div>

<script>
function previewImage(){
const file = document.getElementById("upload").files[0];
const preview = document.getElementById("preview");

if(file){
preview.src = URL.createObjectURL(file);
preview.style.display = "block";
}
}

async function generateMotion(){

const file = document.getElementById("upload").files[0];
const status = document.getElementById("status");
const preview = document.getElementById("preview");

if(!file){
status.innerHTML = "Upload image dulu!";
return;
}

status.innerHTML = "Connecting to Gemini AI...";

setTimeout(()=>{
status.innerHTML = "Analyzing fashion structure...";
},2000);

setTimeout(()=>{
status.innerHTML = "Sending prompt to Gemini...";
},4000);

setTimeout(()=>{
status.innerHTML = "Generating AI motion...";
preview.style.transform = "translateY(-20px)";
preview.style.transition = "1s ease";
},6000);

setTimeout(()=>{
preview.style.transform = "translateY(0px)";
status.innerHTML = "Gemini Motion Complete!";
},8000);

}
