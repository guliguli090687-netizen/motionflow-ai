<!DOCTYPE html>
<html>
<head>
<title>MotionFlow AI</title>
<style>
body{
margin:0;
font-family:Arial;
background:#000;
color:white;
text-align:center;
}

.hero{
padding:100px 20px;
}

button{
padding:15px 30px;
background:#00ccff;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
position:relative;
z-index:10;
}

input{
padding:12px;
width:300px;
margin:20px;
border-radius:8px;
border:none;
}

#preview{
display:none;
max-width:400px;
margin:30px auto;
border-radius:15px;
position:relative;
z-index:1;
}

#status{
margin-top:20px;
font-size:20px;
color:#00ccff;
font-weight:bold;
}
</style>
</head>
<body>

<div class="hero">
<h1>MotionFlow AI</h1>
<p>Upload fashion image and preview render</p>

<input type="file" id="upload" accept="image/*"><br><br>

<button onclick="previewImage()">Preview</button>
<button onclick="generateMotion()">Generate AI Motion</button>

<p id="status"></p>

<br>
<img id="preview">

</div>

<script>
function previewImage(){
const file=document.getElementById("upload").files[0];
const preview=document.getElementById("preview");

if(file){
preview.src=URL.createObjectURL(file);
preview.style.display="block";
}
}

async function generateMotion(){

const status = document.getElementById("status");

status.innerHTML = "Connecting to Gemini API...";

const response = await fetch(
"https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=API_KEY_KAMU",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
contents:[{
parts:[{
text:"Generate fashion motion prompt for runway animation"
}]
}]
})
}
);

const data = await response.json();

status.innerHTML =
data.candidates?.[0]?.content?.parts?.[0]?.text
|| "Motion Generated!";
}
